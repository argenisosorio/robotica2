<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curso - Aprendizaje en Robótica">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <link rel="icon" href="../../static/img/favicon.png">
    <title>Curso - Aprendizaje en Robótica</title>
    <!-- Loader de carga -->
    <link rel="stylesheet" href="../../static/css/loader.css" type="text/css"/>
    <!-- Loader de carga script js -->
    <script src="../../static/js/loader.js"></script>
    <!-- Bootstrap core CSS -->
    <link href="../../static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- font-awesome-6 -->
    <link href="../../static/font-awesome-6/css/fontawesome.css" rel="stylesheet" />
    <link href="../../static/font-awesome-6/css/all.css" rel="stylesheet" />
    <!-- Custom styles for this template -->
    <link href="../../static/css/theme.css" rel="stylesheet">
    <style>
      .list-group-item {
        background-color: #fff !important;
        border-color: #fff !important;
      }
      .list-group-item.active {
        z-index: 2;
        color: #fff;
        background-color: #00a4e1 !important;
        border-color: #0d6efd;
      }
      .btn-success {
        width: 100%;
        background: #fff;
        color: #00a4e1;
        border-color: #00a4e1;
      }
      .btn-success.active {
        color: #fff;
        background-color: #00a4e1 !important;
        border-color: #0d6efd;
      }
      .btn-success:hover {
        background: #00a4e1;
        border-color: #fff;
      }
      /* Estilos generales para todos los tamaños de pantalla */
      #my-img {
        max-width: 100%;
        height: auto;
      }

      /* Dispositivos pequeños (teléfonos) */
      @media (max-width: 576px) {
        .col-3 {
          width: 100%;
          margin-bottom: 10px;
        }

        .col-9 {
          width: 100%;
        }

        .btn-success img {
          width: 15%;
        }

        h1 {
          font-size: 30px;
        }
      }

      /* Dispositivos medianos (tabletas) */
      @media (min-width: 577px) and (max-width: 768px) {
        .col-3 {
          width: 40%;
        }

        .col-9 {
          width: 60%;
        }

        .btn-success img {
          width: 12%;
        }

        h1 {
          font-size: 40px;
        }
      }

      /* Dispositivos grandes (computadoras de escritorio) */
      @media (min-width: 769px) {
        .col-3 {
          width: 25%;
        }

        .col-9 {
          width: 75%;
        }

        .btn-success img {
          width: 9%;
        }

        .btn-success {
          padding: 10px;
        }

        h1 {
          font-size: 50px;
        }
      }
    </style>
  </head>
<body>
  <div class="text-center mt-5 mb-5">
    <a href="#">
      <img
        src="../../static/img/Leccion-1/nina-next-2.png"
        class="llave-inglesa"
        width="250"
      >
    </a>
  </div>
</body>
</html>
