<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curso - Aprendizaje en Robótica">

    <link rel="icon" href="../../static/img/favicon.png">
    <title>Curso - Aprendizaje en Robótica</title>
    <!-- Loader de carga -->

    <!-- Loader de carga script js -->
    <script src="../../static/js/loader.js"></script>
    <!-- Bootstrap core CSS -->
    <link href="../../static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- font-awesome-6 -->
    <link href="../../static/font-awesome-6/css/fontawesome.css" rel="stylesheet" />
    <link href="../../static/font-awesome-6/css/all.css" rel="stylesheet" />
    <!-- Custom styles for this template -->
    <link href="../../static/css/theme.css" rel="stylesheet">
    <style>
      .list-group-item {
        background-color: #fff !important;
        border-color: #fff !important;
      }
      .list-group-item.active {
        z-index: 2;
        color: #fff;
        background-color: #00a4e1 !important;
        border-color: #0d6efd;
      }
      .btn-success {
        width: 100%;
        background: #fff;
        color: #00a4e1;
        border-color: #00a4e1;
      }
      .btn-success.active {
        color: #fff;
        background-color: #00a4e1 !important;
        border-color: #0d6efd;
      }
      .btn-success:hover {
        background: #00a4e1;
        border-color: #fff;
      }
      /* Estilos generales para todos los tamaños de pantalla */
      #my-img {
        max-width: 100%;
        height: auto;
      }

      /* Dispositivos pequeños (teléfonos) */
      @media (max-width: 576px) {
        .col-3 {
          width: 100%;
          margin-bottom: 10px;
        }

        .col-9 {
          width: 100%;
        }

        .btn-success img {
          width: 15%;
        }

        h1 {
          font-size: 30px;
        }

        .mq-text {
          font-size: 12px;
        }
      }

      /* Dispositivos medianos (tabletas) */
      @media (min-width: 577px) and (max-width: 768px) {
        .col-3 {
          width: 40%;
        }

        .col-9 {
          width: 60%;
        }

        .btn-success img {
          width: 12%;
        }

        h1 {
          font-size: 40px;
        }
      }

      /* Dispositivos grandes (computadoras de escritorio) */
      @media (min-width: 769px) {
        .col-3 {
          width: 25%;
        }

        .col-9 {
          width: 75%;
        }

        .btn-success img {
          width: 9%;
        }

        .btn-success {
          padding: 10px;
        }

        h1 {
          font-size: 50px;
        }
      }
    </style>
  </head>
<body>
  <!-- Mostrar la imagen como spinner de carga -->
  <div class="spinner-container" id="spinnerContainer">
    <!-- Cambiar el div con la clase "spinner" por una imagen -->
    <img src="../../static/img/favicon.png" alt="" class="spinner-img">
  </div>

  <!-- Barra de progreso -->
  <div id="progressBar"></div>

  <div class="container-fluid">
    <div
      class="row mb-3"
      style="padding-right: 15px; padding-left: 10px;"
    >
      <!-- Right Column -->
      <div
        class="col-12"
        style="
          border: ridge 1px #FFFFFF;
          border-radius: 5px;
          padding: 20px;
          background: #FFFFFF;
        "
      >
        <!-- Adivinanza 1 -->
        <div
          style="
            border: ridge 1px #00a4e1;
            border-radius: 5px;
            padding: 10px;
            background: #FFFFFF;
          "
        >
          <div class="text-center mt-4 mb-2">
            <iframe
              class="video-responsivo"
              src="https://www.youtube.com/embed/cvepGtsyIx8?si=S9AuuxLnXKA4BgWV"
              title="YouTube video player"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
          <div class="mb-3">
            <div class="row text-center mt-4">
              <div class="col-4">
                <img
                  src="../../static/img/Leccion-1/estrella.png"
                  width="50%"
                  class="mb-3 img-zoom-max"
                >
                <!-- Button trigger modal -->
                <button
                  type="button"
                  class="btn btn-success"
                  data-bs-toggle="modal"
                  data-bs-target="#exampleModal"
                  data-text="¡Incorrecto!"
                  onclick="responseCounter1(0)"
                >
                  <b class="mq-text">Una Estrella</b>
                </button>
                <!-- Final Button trigger modal -->
              </div>
              <div class="col-4">
                <img
                  src="../../static/img/Leccion-1/sol.png"
                  width="50%"
                  class="mb-3 img-zoom-max"
                >
                <!-- Button trigger modal -->
                  <button
                    type="button"
                    class="btn btn-success"
                    data-bs-toggle="modal"
                    data-bs-target="#exampleModal"
                    data-text="¡Incorrecto!"
                    onclick="responseCounter1(0)"
                  >
                  <b class="mq-text">El Sol</b>
                </button>
                <!-- Final Button trigger modal -->
              </div>
              <div class="col-4">
                <img
                  src="../../static/img/Leccion-1/arcoiris.png"
                  width="50%"
                  class="mb-3 img-zoom-max"
                >
                <!-- Button trigger modal -->
                  <button
                    type="button"
                    class="btn btn-success"
                    data-bs-toggle="modal"
                    data-bs-target="#exampleModal"
                    data-text="¡Acertaste!"
                    onclick="responseCounter1(1)"
                  >
                    <b class="mq-text">Un Arcoíris</b>
                </button>
                <!-- Final Button trigger modal -->
              </div>
            </div>

            <!-- Modal -->
            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body d-flex flex-column align-items-center">
                    <img
                      id="modalImage"
                      src=""
                      alt=""
                      style="width: 50%; display: none;"
                    >
                    <h1 class="text-center" id="modalText"></h1>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- Final de Modal -->
          </div>
        </div>
        <!-- Final Adivinanza 1 -->
      </div>
      <!-- End Right Column -->
    </div>
  </div>

  <script src="../../static/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script>
    function unhover(element) {
      element.setAttribute('src', '../../static/img/banner.png');
    }
    function hover(element) {
      element.setAttribute('src', '../../static/img/banner2.png');
    }

    // Selecciona el elemento del modal por su id
    const myModal = document.getElementById('exampleModal');

    // Selecciona todos los botones que tienen el atributo data-bs-toggle="modal"
    const triggerButtons = document.querySelectorAll('[data-bs-toggle="modal"]');

    // Añade un event listener a cada botón encontrado
    triggerButtons.forEach(button => {
      button.addEventListener('click', (event) => {
        // Obtiene el valor del atributo data-text del botón clicado
        const text = event.currentTarget.getAttribute('data-text');

        // Establece el atributo data-text en el modal con el texto obtenido
        myModal.setAttribute('data-text', text);

        // Añade una condición para establecer la imagen
        let imgSrc = "";
        if (text === "¡Acertaste!") {
          imgSrc = "../../static/img/acierto.png"; // Ruta de la imagen que deseas mostrar
        } else {
          imgSrc = "../../static/img/favicon.png"; // Ruta de la imagen para respuestas incorrectas
        }

        // Establece la ruta de la imagen en el modal
        myModal.setAttribute('data-img', imgSrc);
      });
    });

    // Añade un event listener que se activa cuando el modal se muestra
    myModal.addEventListener('shown.bs.modal', () => {
      // Obtiene el valor del atributo data-text del modal
      const text = myModal.getAttribute('data-text');
      // Selecciona el elemento del modal que muestra el texto
      const modalTextElement = document.getElementById('modalText');
      // Actualiza el contenido del elemento con el texto obtenido
      modalTextElement.textContent = text;

      // Obtiene el valor del atributo data-img del modal
      const imgSrc = myModal.getAttribute('data-img');
      // Selecciona el elemento del modal que muestra la imagen
      const modalImageElement = document.getElementById('modalImage');

      // Si hay una imagen, la muestra, de lo contrario la oculta
      if (imgSrc) {
        modalImageElement.src = imgSrc;
        modalImageElement.style.display = 'block';
      } else {
        modalImageElement.style.display = 'none';
      }
    });

  </script>

  <script>
    const text = "Desarrollado por CENDITEL";
    const typewriterElement = document.getElementById("typewriter");
    let index = 0;
    let deleting = false;

    function typeEffect() {
      // Mostrar o borrar caracteres
      typewriterElement.textContent = text.substring(0, index);

      if (!deleting) {
        if (index < text.length) {
          index++;
        } else {
          deleting = true;
          setTimeout(typeEffect, 1000); // Pausa antes de borrar
          return;
        }
      } else {
        if (index > 0) {
          index--;
        } else {
          deleting = false;
        }
      }

      // Cambiar la velocidad dependiendo de si escribe o borra
      const speed = deleting ? 50 : 100;
      setTimeout(typeEffect, speed);
    }

    // Iniciar el efecto
    typeEffect();
  </script>

  <script>
    // Selecciona la barra de progreso
    const progressBar = document.getElementById('progressBar');

    // Escuchar el evento de scroll
    window.addEventListener('scroll', () => {
    // Altura total del documento
    const scrollHeight = document.documentElement.scrollHeight;

    // Altura visible de la ventana
    const clientHeight = document.documentElement.clientHeight;

    // Distancia desplazada desde la parte superior
    const scrollTop = document.documentElement.scrollTop;

    // Calcular el porcentaje de progreso
    const scrollPercentage = (scrollTop / (scrollHeight - clientHeight)) * 100;

    // Actualizar el ancho de la barra
    progressBar.style.width = `${scrollPercentage}%`;
    });
  </script>

  <script>
    countArray1 = []

    /**
     * Rellena el valor del arreglo si se acierta la adivinanza 1.
     */
    function responseCounter1(value) {
      if (value === 1) {
        countArray1.push(value);
        show();
      } else {
        countArray1.pop();
        show();
      }
    }

    countArray2 = []

    /**
     * Rellena el valor del arreglo si se acierta la adivinanza 2.
     */
    function responseCounter2(value) {
      if (value === 1) {
        countArray2.push(value);
        show();
      } else {
        countArray2.pop();
        show();
      }
    }

    /**
     * Muestra u oculta la flecha de avance a la siguiente lección.
     *
     * La función verifica si ambos arreglos de conteo (countArray1 y countArray2)
     * tienen más de un elemento. Si es así, muestra la flecha de la derecha
     * (permitiendo avanzar a la siguiente lección). Si no, la oculta.
     *
     * Esto sirve para asegurarse de que el usuario haya respondido correctamente
     * ambas adivinanzas antes de poder continuar.
     */
    function show() {
      if (countArray1.length >= 1 && countArray2.length >= 1) {
        // Mostrar la felcha derecha.
        document.getElementById('flecha_derecha').style.display = 'inline';
      } else {
        // Ocultar la flecha derecha.
        document.getElementById('flecha_derecha').style.display = 'none';
      }
    }
  </script>
</body>
</html>
